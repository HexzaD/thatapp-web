<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/thatapp-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="thatapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>thatapp</title>
  <link rel="manifest" href="manifest.json">
  <!--
    Tesseract.js: receipt OCR that runs entirely in the browser. No API key,
    no account, no server call, and no image ever leaves the device -- which
    for photographs of what someone bought is a meaningful privacy property
    on top of being free.

    Loaded lazily by thatappOcr() rather than on page load, so the ~2 MB of
    worker and language data is only fetched by someone who actually scans a
    receipt.
  -->
  <script>
    window.thatappOcrReady = false;

    window.thatappLoadOcr = function () {
      if (window.Tesseract) return Promise.resolve();
      if (window.__thatappOcrLoading) return window.__thatappOcrLoading;

      window.__thatappOcrLoading = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = function () { window.thatappOcrReady = true; resolve(); };
        s.onerror = function () {
          reject(new Error('Could not load the text recogniser.'));
        };
        document.head.appendChild(s);
      });
      return window.__thatappOcrLoading;
    };

    // Returns the recognised text, or throws. Dart calls this and does all
    // the parsing -- keeping the JS surface as small as possible, because
    // logic here is untestable from the Dart test suite.
    window.thatappOcr = async function (dataUrl) {
      await window.thatappLoadOcr();
      var result = await window.Tesseract.recognize(dataUrl, 'eng');
      return result.data.text;
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
