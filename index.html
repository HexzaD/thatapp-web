<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/thatapp-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="thatapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>thatapp</title>
  <link rel="manifest" href="manifest.json">
  <!--
    Tesseract.js: receipt OCR that runs entirely in the browser. No API key,
    no account, no server call, and no image ever leaves the device -- which
    for photographs of what someone bought is a meaningful privacy property
    on top of being free.

    Loaded lazily by thatappOcr() rather than on page load, so the ~2 MB of
    worker and language data is only fetched by someone who actually scans a
    receipt.
  -->
  <script>
    window.thatappOcrReady = false;

    window.thatappLoadOcr = function () {
      if (window.Tesseract) return Promise.resolve();
      if (window.__thatappOcrLoading) return window.__thatappOcrLoading;

      window.__thatappOcrLoading = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = function () { window.thatappOcrReady = true; resolve(); };
        s.onerror = function () {
          reject(new Error('Could not load the text recogniser.'));
        };
        document.head.appendChild(s);
      });
      return window.__thatappOcrLoading;
    };

    // Returns the recognised text, or throws. Dart calls this and does all
    // the parsing -- keeping the JS surface as small as possible, because
    // logic here is untestable from the Dart test suite.
    window.thatappOcr = async function (dataUrl) {
      await window.thatappLoadOcr();
      var result = await window.Tesseract.recognize(dataUrl, 'eng');
      return result.data.text;
    };

    // Opens the browser file chooser and returns the chosen file.
    //
    // Written here rather than taken from file_picker because that package's
    // web implementation never attaches its <input> to the live document, and
    // Chrome will not open a chooser for a disconnected input -- the button
    // simply does nothing. This attaches the input, awaits the choice, and
    // removes it again.
    //
    // Resolves to a JSON string {name, mime, data} where data is base64, or to
    // null when the user cancels. One string in, one string out: the Dart side
    // does every bit of decision-making, because JS here is untestable from
    // the Dart test suite.
    window.thatappPickFile = function (accept) {
      return new Promise(function (resolve) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = accept || '';
        // Off-screen rather than display:none -- a hidden input is skipped by
        // some browsers' chooser heuristics.
        input.style.cssText =
          'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
        document.body.appendChild(input);

        var settled = false;
        function finish(value) {
          if (settled) return;
          settled = true;
          if (input.parentNode) input.parentNode.removeChild(input);
          resolve(value);
        }

        input.addEventListener('change', function () {
          var file = input.files && input.files[0];
          if (!file) { finish(null); return; }
          var reader = new FileReader();
          reader.onerror = function () { finish(null); };
          reader.onload = function () {
            // reader.result is "data:<mime>;base64,<payload>".
            var comma = String(reader.result).indexOf(',');
            finish(JSON.stringify({
              name: file.name,
              mime: file.type || '',
              data: String(reader.result).substring(comma + 1)
            }));
          };
          reader.readAsDataURL(file);
        });

        // Fires when the chooser is dismissed without a selection. Not every
        // browser sends it, so cancellation is also inferred from a change
        // event carrying no file.
        input.addEventListener('cancel', function () { finish(null); });

        input.click();
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
